[package]
name = "apollinaires-ascii"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Static art, block lettering and animation as real ASCII text"
repository = "https://github.com/EquityBot/ApollinaireASCII"
homepage = "https://equitybot.github.io/ApollinaireASCII/"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::images", "text-processing", "wasm"]
include = ["/src", "/tests", "/examples", "/LICENSES", "/README.md", "/LICENSE.md", "/THIRD_PARTY_NOTICES.md"]
keywords = ["ascii", "art", "figlet", "animation", "wasm"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "apollinaire"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ureq"]
web = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "pnm"] }
serde = "1"
serde_json = "1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
weezl = "0.2.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", optional = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlAnchorElement", "Event", "BeforeUnloadEvent", "EventTarget", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Navigator", "Clipboard", "MediaQueryList", "Performance", "VisibilityState", "AbortController", "AbortSignal", "AddEventListenerOptions", "DomException", "HtmlMediaElement", "HtmlProgressElement", "HtmlVideoElement", "ImageData", "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "PointerEvent", "MouseEvent", "KeyboardEvent", "ClipboardEvent", "DataTransfer", "DomRect", "DomRectReadOnly", "FocusOptions"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
ref_option = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
