name: Bug report
description: Something produces wrong output, fails or crashes.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `apollinaire --version`, or 'browser editor'.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The command or editor steps. Attach the input file if you can share it.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
