name: Checks and browser

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: native-${{ runner.os }}-
      # Coverage needs llvm-tools and a prebuilt cargo-llvm-cov, with no fallback to compiling it.
      - name: Install llvm-tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - name: Install the pinned cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked
      - name: Run the tests with line coverage
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --locked --lcov --output-path coverage-rust.lcov
      - name: Keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage-rust.lcov
          retention-days: 1
      - run: cargo build --locked --release
      - run: cargo run --locked --example library

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs.
  codecov:
    name: upload coverage to Codecov
    needs: [native]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not turn the tests badge red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-rust
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-rust.lcov
          disable_search: true
          fail_ci_if_error: true

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: browser-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: browser-
      - name: Install wasm-bindgen and wasm-opt
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSLo binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          sha256sum -c <<'EOF'
          9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  wasm-bindgen.tar.gz
          2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  binaryen.tar.gz
          EOF
          mkdir -p "$HOME/.local/bin"
          tar -xzf wasm-bindgen.tar.gz -C "$HOME/.local/bin" --strip-components=1 wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen-test-runner
          tar -xzf binaryen.tar.gz -C "$HOME/.local/bin" --strip-components=2 binaryen-version_133/bin/wasm-opt
          rm wasm-bindgen.tar.gz binaryen.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features web --lib --tests -- -D warnings
      # The runner image ships Chrome with a matching chromedriver.
      - name: Editor tests in headless Chrome
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test-editor
      - run: cargo build --locked --release --target wasm32-unknown-unknown --no-default-features --features web
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/apollinaire_ascii.wasm --target web --out-dir web/pkg --out-name apollinaire_ascii
      # -O3 rather than -Os or -Oz: it favours conversion speed over a few more kilobytes.
      - run: wasm-opt -O3 web/pkg/apollinaire_ascii_bg.wasm -o web/pkg/apollinaire_ascii_bg.wasm
      # Pages caches each file for 10 minutes; per-commit URLs stop a deploy mixing a cached loader with a new module.
      - name: Version asset URLs
        run: |
          sed -E -i "s#(\./(style\.css|pkg/[a-z_]+(\.js|_bg\.wasm)))([\"'])#\1?v=${GITHUB_SHA}\4#g" web/index.html
          test "$(grep -o "?v=${GITHUB_SHA}" web/index.html | wc -l)" -eq 3
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [native, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
